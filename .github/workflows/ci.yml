name: Cross-platform CI

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OBS_VERSION: 32.1.2

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/audit-release.sh

  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build git curl file pkg-config \
            obs-studio libobs-dev qt6-base-dev libsimde-dev libsecret-1-dev
          git clone --depth 1 --branch "${OBS_VERSION}" \
            https://github.com/obsproject/obs-studio.git third_party/obs-studio
      - name: Configure, build, and test
        run: |
          set +e
          (set -e
           cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
           cmake --build build-ci --parallel
           ctest --test-dir build-ci --output-on-failure) 2>&1 | tee linux-build.log
          result=${PIPESTATUS[0]}
          set -e
          if (( result != 0 )); then
            diagnostic="$(tail -100 linux-build.log | tail -c 6000)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Linux build failed::${diagnostic}"
            exit "${result}"
          fi
      - name: Validate architecture and package
        run: |
          ./scripts/validate-architecture.sh linux build-ci/libkaltura-live.so x86_64
          cmake --build build-ci --target package
      - uses: actions/upload-artifact@v7
        with:
          name: kaltura-live-linux-x86_64
          path: |
            build-ci/*.deb
            build-ci/*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            obs_arch: Intel
          - arch: arm64
            runner: macos-15
            obs_arch: Apple
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        env:
          OBS_MACOS_ARCH: ${{ matrix.obs_arch }}
        run: |
          set +e
          (set -e
           brew install cmake ninja simde
           ./scripts/setup-macos-ci.sh
           git clone --depth 1 --branch "${OBS_VERSION}" \
             https://github.com/obsproject/obs-studio.git third_party/obs-studio) \
            2>&1 | tee macos-setup.log
          result=${PIPESTATUS[0]}
          set -e
          if (( result != 0 )); then
            diagnostic="$(tail -100 macos-setup.log | tail -c 6000)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=macOS setup failed::${diagnostic}"
            exit "${result}"
          fi
      - name: Build, test, validate, and package
        env:
          BUILD_DIR: ${{ github.workspace }}/build-ci
          DIST_DIR: ${{ github.workspace }}/dist
          MACOS_ARCHITECTURES: ${{ matrix.arch }}
        run: |
          set +e
          QT_PREFIX="${QT_PREFIX}" ./scripts/package-macos.sh --without-models \
            2>&1 | tee macos-build.log
          result=${PIPESTATUS[0]}
          set -e
          if (( result != 0 )); then
            diagnostic="$(tail -100 macos-build.log | tail -c 6000)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=macOS build failed::${diagnostic}"
            exit "${result}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: kaltura-live-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos-universal:
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kaltura-live-macos-x86_64
          path: input/x86_64
      - uses: actions/download-artifact@v8
        with:
          name: kaltura-live-macos-arm64
          path: input/arm64
      - name: Merge and validate Universal 2 bundle
        run: |
          mkdir -p unpack/x86_64 unpack/arm64 dist
          tar -xzf input/x86_64/*-macOS-x86_64.tar.gz -C unpack/x86_64
          tar -xzf input/arm64/*-macOS-arm64.tar.gz -C unpack/arm64
          ./scripts/package-macos-universal.sh \
            unpack/x86_64/kaltura-live.plugin unpack/arm64/kaltura-live.plugin dist
      - uses: actions/upload-artifact@v7
        with:
          name: kaltura-live-macos-universal
          path: dist/*
          if-no-files-found: error

  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Prepare official OBS build dependencies
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE/windows-setup.log"
          function Invoke-Checked {
            param([scriptblock] $Command)
            & $Command 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "Command failed with exit code $LASTEXITCODE" }
          }
          try {
          $depsVersion = '2025-07-11'
          $root = "$env:GITHUB_WORKSPACE/.deps"
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-Checked { curl.exe -fL "https://github.com/obsproject/obs-deps/releases/download/$depsVersion/windows-deps-$depsVersion-x64.zip" -o "$root/obs-deps.zip" }
          Invoke-Checked { curl.exe -fL "https://github.com/obsproject/obs-deps/releases/download/$depsVersion/windows-deps-qt6-$depsVersion-x64.zip" -o "$root/qt6.zip" }
          Expand-Archive "$root/obs-deps.zip" "$root/obs-deps"
          Expand-Archive "$root/qt6.zip" "$root/qt6"
          Invoke-Checked { git clone --depth 1 --branch $env:OBS_VERSION https://github.com/obsproject/obs-studio.git third_party/obs-studio }
          $prefix = "$root/obs-deps;$root/qt6"
          $obsVersion = $env:OBS_VERSION
          Invoke-Checked { cmake -S third_party/obs-studio -B obs-build -G "Visual Studio 17 2022" -A x64 `
              "-DOBS_CMAKE_VERSION:STRING=3.0.0" "-DOBS_VERSION_OVERRIDE:STRING=$obsVersion" `
              "-DENABLE_PLUGINS:BOOL=OFF" "-DENABLE_FRONTEND:BOOL=OFF" `
              "-DCMAKE_PREFIX_PATH:PATH=$prefix" }
          Invoke-Checked { cmake --build obs-build --target obs-frontend-api --config RelWithDebInfo --parallel }
          Invoke-Checked { cmake --install obs-build --component Development --config RelWithDebInfo --prefix "$root/obs-sdk" }
          } catch {
            $diagnostic = ((Get-Content $log -Tail 100) -join "%0A").Replace('%', '%25')
            $diagnostic = $diagnostic.Replace('%250A', '%0A').Replace("`r", '%0D')
            Write-Output "::error title=Windows OBS SDK setup failed::$diagnostic"
            throw
          }
      - name: Configure, build, test, and package
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE/windows-build.log"
          function Invoke-Checked {
            param([scriptblock] $Command)
            & $Command 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "Command failed with exit code $LASTEXITCODE" }
          }
          try {
          $root = "$env:GITHUB_WORKSPACE/.deps"
          $prefix = "$root/obs-sdk;$root/obs-deps;$root/qt6"
          Invoke-Checked { cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 `
              "-DCMAKE_PREFIX_PATH:PATH=$prefix" `
              "-DKALTURA_LIVE_OBS_SOURCE_PATH:PATH=$env:GITHUB_WORKSPACE/third_party/obs-studio" }
          Invoke-Checked { ./scripts/package-windows.ps1 -BuildDirectory build-ci -DistDirectory dist -Configuration RelWithDebInfo }
          } catch {
            $diagnostic = ((Get-Content $log -Tail 100) -join "%0A").Replace('%', '%25')
            $diagnostic = $diagnostic.Replace('%250A', '%0A').Replace("`r", '%0D')
            Write-Output "::error title=Windows plugin build failed::$diagnostic"
            throw
          }
      - uses: actions/upload-artifact@v7
        with:
          name: kaltura-live-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
