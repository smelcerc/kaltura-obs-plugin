name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: ./scripts/audit-release.sh

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref_type == 'tag'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: kaltura-live-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.pkg
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${notes_file}" ]]; then notes_file="RELEASE_NOTES_TEMPLATE.md"; fi
          mapfile -d '' release_assets < <(find dist -maxdepth 1 -type f -print0)
          gh release create "${GITHUB_REF_NAME}" "${release_assets[@]}" \
            --verify-tag --latest --notes-file "${notes_file}" \
            --title "Kaltura Live ${{ needs.validate.outputs.version }}"
